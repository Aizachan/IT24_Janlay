<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        .done{
            text-decoration: line-through;
            color: gray;
        }
        </style>
</head>
<body>
    <h1>To-Do List</h1>
    <input type="text" id="taskInput" placeholder="Add a new task...">/>
    <button onclick="addTask()">Add Task</button>
    <ul id="taskList"> Task goes here</ul>ul>
    
    <script>
        function addTask(){
            const taskText = getTaskText();
            if (taskText) {
                addTaskItem(taskText);
            } else {
                console.log("No task entered");
            }
        }
        function getTaskText(){
            const input = document.getElementById('taskInput');
            const value = input.value.trim();
            console.log("get TaskText() called ->", value);
            return value;
        
            
        }
        // function addTaskItem (taskItem){
        //     const input = document.getElementById('taskInput');
        //     const value = input.value.trim();
        //     console.log("get TaskText() called ->", value);
        //     return value;
    
    
        function addTaskItem(taskText){
            const li = document.createElement("li");
            li.textContent = taskText;

            document.getElementById('taskList').appendChild(li);
            console.log("addTaskItem() called ->", taskText,Date());

            const deleteBtn = createDeleteButton(li);
            li.appendChild(deleteBtn);

            const taskSpan = document.createElement('span');
            taskSpan.textContent = taskText;
            const editBtn = createEditButton(li, taskSpan);
            li.appendChild(editBtn);
        }
        // function createDeleteButton(li){
        //     const deleteBtn = document.createElement('button');
        //     deleteBtn.textContent = 'X';
        //     deleteBtn.classname = "delete-btn";
        //     deleteBtn.style.marginLeft = "8px"
        //     deleteBtn.onclick = () => handleDeleteClick(li);

        //     console.log("createDeleteButton() called ->", li.textContent);
        //     return deleteBtn;
        
        //     }
        //    function handleDeleteButtonClick(li){
        //     console.log("handleDeleteClick() ->", li.textContent.replace("X","").trim(),Date());
        //    }
        function createDeleteButton(li){
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = "delete-btn";
            deleteBtn.style.marginLeft = "8px";
            deleteBtn.onclick = () => handleDeleteButtonClick(li);

            console.log("createDeleteButton() called ->", li.textContent);
            return deleteBtn;
        }
        function handleDeleteButtonClick(li){
            console.log("handleDeleteButtonClick() ->", li.textContent.replace("Delete","").trim(), Date());
            li.remove();
        }
        function createEditButton(li, taskSpan){
            const editBtn = document.createElement('button');
            editBtn.textContent = 'Edit';
            editBtn.className = 'edit-btn';
            editBtn.style.marginLeft = '8px';
            editBtn.onclick = () => handleEditButtonClick(li);

            console.log("createEditButton() called ->", taskSpan.textContent);
            return editBtn;
        }
        function handleEditClick(li){
            const currentText = li.firstChild.textContent.trim();
            console.log("handleEditClick() ->", currentText, Date());

            const newText = prompt("Edit task:", currentText);
            if (newText !== null && newText.trim() !== "") {
                li.firstChild.textContent = newText.trim();
                console.log("handleEditClick() ->", newText.trim(), Date());
            } else {
                console.log("handelEditClick -> no change made");
            }
        }
        function createDoneButton(li){
            const doneBtn = document.createElement('button');
            doneBtn.textContent = 'Done';
            doneBtn.className = 'done-btn';
            doneBtn.style.marginLeft = '8px';
            doneBtn.onclick = () => {
                const li = taskSpan.parentElement;
                console.log(li);

                li.classList.add("done");

                const buttons = li.querySelectorAll('button');
                

                buttons.forEach(btn =>{
                    btn.disabled = true;
                });

                console.log("Task Completed:", li.textContent), Date();
            }
            return doneBtn;
        }
        
    </script>
</body>
</html>

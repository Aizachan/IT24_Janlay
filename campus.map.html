<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <style>
        #map { 
            height: 500px;
         }
         .popup-image{
             max-width: 200px;
            height: auto;
            object-fit: fill;
         }
    </style>
</head>
<body>
    <h1>Maps</h1>
    <div id="map"></div>
    
    </body>

    <script>
        function initMap(mapDataUrl){
            const map = L.map('map').setView([8.360302114528377, 124.8684101925283], 17);

            //openStreetMap
            const openStreetMap = tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,

                attribution: '&copy; OpenStreetMap contributors'

            })
            //Satellite
            const satellite = L.tileLayer{
                'https://server.arcgrisonline.com/ArcGIS/rest/services/World_Imagerary/MapServer/tile/{z}/{y}/{x}',
                {attribution:'Tiles (c) Esri - Source, Maxar, Earthstar Geographics, and GIS User Community'}
            }
            // .addTo(map);
            // console.log("Map loaded" + Date());
            openStreetMap.addTo(Map);
            console.log("Base map tile layer loaded" + Date ());

            const markerGroups = {};

            
            fetch(mapDataUrl)
            .then(response => response.json())
            .then(data => {
                data.forEach(pin=>{
                    const marker = L.marker([pin.lat, pin.lng]).addTo(map);

                    const img = `<img scr='${pin.img}' class="popup-image">`;
                    // marker.bindPopup(`${pin.name}<br>${pin.description}`);
                    // console.log(`${pin.name} Loaded `+ Date()); 
                    marker.bindPopup(`
                    ${img} <br>
                    <b>${pin.title}<br>
                        ${pin.description}
                    `);    
                });
            })
            .catch(err => console.error("Error loading JSON:", err));
        }
        
        document.addEventListener('DOMContentLoaded',()=>{ 
            initMap('maps.json');
        });

        /*add marker group into the map according to marker filter 
        object.values (markerGroups).forEach(group =>group.addTo(map));
        // map layer control 
        // const baseMaps = {
        "OpenStreetMap"; openStreetMap,
        "Satellite": satellite*/
        
   </script>
</html>
